<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Browse large astronomical catalogs in the HATS format">

    <title>LSDB Data Repository</title>

    <!-- Assets paths from the root -->
    <base href="/">

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<!-- Our custom CSS -->
    <link href="assets/css/style.css" rel="stylesheet">
    
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon-16x16.png">
    <link rel="manifest" href="assets/img/site.webmanifest">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i%7CNunito:300,300i,400,400i,600,600i,700,700i%7CPoppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

  </head>

  <body>
    <div id="gaia-bg" aria-hidden="true"></div>

    <header class="site-header sticky-top">
      <nav class="navbar container-fluid px-4">
        <a class="lsdb-brand navbar-brand d-flex align-items-center" href="/">
          <img src="assets/img/logo.webp" alt="LSDB logo">
          <span class="fw-bold ms-2">LSDB</span>
        </a>
        <div class="d-flex align-items-center gap-3 ms-auto">
          <div class="mirrors-nav-item dropdown d-none d-md-block">
            <a href="#" class="nav-link fw-semibold dropdown-toggle" id="mirrors-trigger" data-bs-toggle="dropdown" aria-expanded="false">
              External Data Mirrors <span class="mirrors-chevron"></span>
            </a>
            <div class="dropdown-menu dropdown-menu-end mirrors-card" aria-labelledby="mirrors-trigger">
              <p class="mirrors-card-desc">Copies hosted by external collaborators</p>
              <div class="mirrors-list">
                <a class="mirror-item" href="https://vizcat.cds.unistra.fr/hats" target="_blank" rel="noopener">
                  <img class="mirror-logo" src="assets/img/cds.webp" alt="CDS logo">
                  <div class="mirror-info">
                    <div class="mirror-name">CDS</div>
                    <div class="mirror-desc">Strasbourg Astronomical Data Center</div>
                  </div>
                </a>
                <div class="mirrors-divider"></div>
                <a class="mirror-item" href="https://huggingface.co/collections/UniverseTBD/multimodal-universe-hats" target="_blank" rel="noopener">
                  <img class="mirror-logo" src="assets/img/huggingface.webp" alt="HuggingFace logo">
                  <div class="mirror-info">
                    <div class="mirror-name">HuggingFace</div>
                    <div class="mirror-desc">Open-source AI & dataset community hub</div>
                  </div>
                </a>
                <div class="mirrors-divider"></div>
                <a class="mirror-item" href="https://data.linea.org.br/en/lsdb/index.html" target="_blank" rel="noopener">
                  <img class="mirror-logo" src="assets/img/linea.webp" alt="LIneA logo">
                  <div class="mirror-info">
                    <div class="mirror-name">LineA</div>
                    <div class="mirror-desc">Interinstitutional Laboratory for e-Astronomy</div>
                  </div>
                </a>
              </div>
            </div>
          </div>
          <a href="https://docs.lsdb.io/en/latest/data-access/datalsdb.html" class="btn btn-primary btn-sm fw-bold px-3 d-flex align-items-center gap-2" aria-label="Documentation">
            <span class="d-none d-md-inline">Documentation</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16" style="height:1.5rem;display:block;flex-shrink:0;" aria-hidden="true">
              <path d="M5 4a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1H5zm-.5 2.5A.5.5 0 0 1 5 6h6a.5.5 0 0 1 0 1H5a.5.5 0 0 1-.5-.5zM5 8a.5.5 0 0 0 0 1h6a.5.5 0 0 0 0-1H5zm0 2a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1H5z"/>
              <path d="M9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.5L9.5 0zm0 1v2A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5z"/>
            </svg>
          </a>
        </div>
      </nav>
    </header>

    <main>
      <div id="hero"></div>
    </main>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
  
  </body>
  
</html>
