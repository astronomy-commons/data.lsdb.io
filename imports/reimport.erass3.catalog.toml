# catalog.toml — ONE file per import run. Every template in this skill reads it; a run is reproducible from
# this file alone. Copy it into the work directory, fill it during the decision interview, keep it with the run.
# Values marked (interview) are decided with the user; everything else has a safe default.

[run]
survey = "erosita"   # (interview) short lowercase survey name; used in directory and catalog names
release = "erass3"   # (interview) release tag, lowercase
work_dir = "."   # scripts, logs, notebook, NOTES.md, runlog.jsonl; a relative path is taken from the directory holding this file ("." = that directory)
raw_dir = "/sdf/data/rubin/user/ncaplar/erosita/raw_erass3"   # downloads; relative = from work_dir; "" -> $HATS_PUBLISH_RAW_ROOT/<survey>/raw_<release>
build_root = "/sdf/data/rubin/cosmicdata/lsdb/erosita/reimport_2026-10"   # where the collection is built; relative = from work_dir; "" -> $HATS_PUBLISH_BUILD_ROOT
route = "reimport"   # (interview) "hats-import" | "small" | "reimport"  (small = import_small.py, lsdb.from_dataframe: < 1e6 rows and < 1 GB;
                                    # reimport = repartition [run].reimport_from with [partitioning]; [columns].sort is NOT applied (the source's _healpix_29 is reused);
                                    # the source's properties are kept unless restated in [properties])
reimport_from = "/sdf/data/rubin/cosmicdata/lsdb/erosita/erosita_dr2_erass3"   # route "reimport": existing HATS catalog or collection root whose partition files are the input
reimport_of = "/sdf/data/rubin/cosmicdata/lsdb/erosita/erosita_dr2_erass3"   # (interview, informational) path or URL of the HATS version being replaced; compare_versions.py --old takes it
expect_differences = false   # (interview) true when this version FIXES reimport_of (wrong values, columns or types): compare_versions
                                    # then reports those differences as expected (exit 4) and fails only on different rows or ids
expect_removed_rows = false         # (interview) true when this version REMOVES rows of reimport_of on purpose (duplicate rows, rows without coordinates): compare_versions reports ids only in the old copy as expected (exit 4)

[source]
urls = []   # files to download into raw_dir (https only)
files = ["/sdf/data/rubin/user/ncaplar/erosita/raw_erass3/eRASS3_Main_v1.3.fits.gz"]   # or local files / globs already on disk; relative entries are taken from work_dir; indexed formats: the index files
format = "fits"   # fits | csv | ecsv | parquet | indexed_csv | indexed_parquet
data_model_url = "https://erosita.mpe.mpg.de/dr2/AllSkySurveyData_dr2/Catalogues_dr2/RamosM_DR2/eRASS3_Main_v1.3.html"                 # column description page, saved next to the data
expected_files = 1   # number of data files the archive publishes (indexed formats: files listed in the index files); 0 = unknown; the input-size pass refuses to start on a mismatch
expected_total_rows = 1975540   # rows that will be IN THE CATALOG (source rows minus rows dropped by the coordinate filter); 0 = unknown; hats-import stops on mismatch
sha256 = { "eRASS3_Main_v1.3.fits.gz" = "0eb3df0c688f8ac95e63df73a7d582fc7e325cb7a57b72e070afe139541c619c" }   # filename -> digest; filled by the acquire step

[source.companions]                 # (interview) row-parallel FITS files that complete each main file (same rows, same order)
files = []                          # [{ dir = "../extra", suffix = "-ex" }]: companion = <main dir>/<dir>/<main stem><suffix>.fits
key_columns = []                    # columns that must be identical in every file, chunk by chunk (e.g. ["OBJ_ID"] or ["FIELD_ID", "OBJ_ID"])

[source.positions_from]             # (interview) only for tables WITHOUT coordinates: positions are copied from a reference HATS
catalog = ""                        # collection root (or catalog) that has an index on `id`; "" = the table has its own ra/dec
id = ""                             # id column present in the source table and in the reference catalog
ra = "ra"                           # reference columns copied into the source under [columns].ra / [columns].dec
dec = "dec"                         # attach_positions.py writes <work_dir>/positions/*.parquet; the import then reads those

[reader]                            # options for hats-import's file readers (see reference/import.md)
chunksize = 500000
hdu = 1                             # fits only
column_names = []                   # fits/parquet/indexed_parquet: keep-list (fits: wins over skip_column_names); csv: the column names of a header-less file
skip_column_names = []              # fits: drop-list
type_map = {}                       # csv: column -> dtype (required when a data model exists); for many columns delete this line and add a [reader.type_map] table at the end of the file
schema_file = ""                    # parquet file giving names/types for csv or unequal-schema inputs; relative = from work_dir
flatten_tensors = true              # fits multi-dimensional columns -> fixed-length lists
drop_rows_without_coordinates = false   # drop rows with NaN or out-of-range ra/dec (the count is reported and reconciled in verification)
strip_strings = true               # strip leading and trailing blanks from string columns: leading blanks, and any padding the reader leaves (FitsReader already drops FITS trailing blanks); applied identically in verification
csv_kwargs = {}                     # extra pandas.read_csv arguments, e.g. { sep = "|", comment = "#" }; compression = "gzip" is added for .gz inputs
ecsv_header = false                 # csv with an ECSV header (archive bulk exports with an ECSV header): scalar types and array columns ("[v1,v2,...]" -> list columns) come from the header
derive = ""                         # FITS: "file.py:function" in the work dir adding columns per chunk (function(get, input_file) -> {name: array}); "" = none
pack_nested = { name = "", columns = [] }   # FITS: pack list columns matching these fnmatch patterns into one nested (struct-of-lists) column; name "" = none
conform_schema = ""                 # any format: a Parquet file (e.g. a _common_metadata) whose schema every chunk is given after the [columns] rules: missing columns become all-null, the others are cast; a column not in it is an error; relative = from work_dir; "" = off

[columns]
ra = "RA"   # (interview)
dec = "DEC"   # (interview)
id = ["UID"]   # (interview) survey id column(s); a composite key is a list
default = ["IAUNAME", "SKYTILE", "ID_SRC", "DETUID", "UID", "UID_DR1", "UID_Hard", "RA", "DEC", "POS_ERR", "RADEC_ERR", "LII", "BII", "EXT", "EXT_ERR", "EXT_LIKE", "DET_LIKE_0", "ML_CTS_1", "ML_CTS_ERR_1", "ML_RATE_1", "ML_RATE_ERR_1", "ML_FLUX_1", "ML_FLUX_ERR_1", "ML_BKG_1", "ML_EXP_1", "ML_EEF_1", "APE_CTS_1", "APE_BKG_1", "APE_EXP_1", "APE_RADIUS_1", "APE_POIS_1", "FLAG_SP_SNR", "FLAG_SP_BPS", "FLAG_SP_SCL", "FLAG_SP_LGA", "FLAG_SP_GC_CONS", "FLAG_NO_RADEC_ERR", "FLAG_NO_EXT_ERR", "FLAG_NO_CTS_ERR", "FLAG_OPT"]   # (interview) hats_cols_default; must exist in the schema; nested as "frame.subcol"
sort = ""   # hats-import sort_columns (comma-separated string); "" = spatial order only; not applied on route "reimport"
drop = []   # (interview) columns not imported
rename = {}                         # (interview) old -> new
cast = {}                           # (interview) column -> dtype (numpy or pandas names, e.g. { flux = "float32", n_obs = "Int32" }); never cast ra/dec
nested_time_series = false          # (interview, informational) true = one row per object with nested detections; the layout is built outside these templates

[names]                             # (interview) see reference/properties.md "naming"
collection = "erosita_dr2_erass3"   # collection directory; obs_collection of the collection
catalog = "erass3_main"   # main catalog directory; obs_collection of the catalog
public_name = "erosita_dr2_erass3"   # URL path on the web host: <HATS_PUBLISH_WEB_URL>/<public_name>; may be nested in a group directory
                                    # ("wise/allwise"); the data copy stays at <survey>/<collection>, only the web link is nested

[partitioning]                      # (interview) see reference/import.md "partitioning"
target_file_mb = [200, 800]         # the sizing rule in MB (10^6 bytes); estimate_threshold.py derives pixel_threshold from it
pixel_threshold = 94271   # rows per partition; 0 = take the estimate
byte_pixel_threshold = 0            # bytes per partition; non-zero overrides pixel_threshold
highest_order = 6
lowest_order = 0
constant_order = -1                 # >= 0 forces one order (sparse catalogs); ignores thresholds
drop_empty_siblings = true
row_groups = { strategy = "subtile_order_delta", value = 1 }   # or { strategy = "num_rows", value = 200000 } or { strategy = "single" }; the small route applies num_rows only
skymap_alt_orders = [2, 4, 6]

[nested]                            # (interview) optional nested product: join per-object list columns from a reference HATS by id
catalog = ""                        # reference HATS (collection root) whose rows carry the list columns; "" = no nested product
id = ""                             # join column present in both catalogs (positions must agree: the join is spatial)
columns = []                        # columns taken from the reference (scalars and lists)
list_columns = []                   # subset packed into the nested column with lsdb nest_lists (pyarrow list dtypes)
name = "lightcurve"                 # name of the nested column
output = ""                         # collection name written next to the flat one (attach_nested.py)
pixel_threshold = 0                 # rows per partition for the nested product (0 = [partitioning].pixel_threshold); size it by bytes, see reference/import.md

[margins]                           # (interview)
default_arcsec = 30   # 10 for optical/IR, 30 for X-ray/radio; integer when integral; 0 = no default margin (tests only)
extra_arcsec = []   # e.g. [300] for astrometric reference catalogs (named _5arcmin by hats-import)

[index]                             # (interview)
columns = ["UID"]   # one index table per entry; each entry is a column name

[properties]                        # (interview) see reference/properties.md; empty strings are not written (route "reimport": the source's value is kept)
obs_regime = "X-ray"                     # Radio | Millimeter | Infrared | Optical | UV | EUV | X-ray | Gamma-ray
hats_frame = "equatorial"           # equatorial | galactic | ecliptic
hats_coordinate_epoch = ""          # e.g. "J2016.0"
obs_title = "eROSITA-DE DR2 eRASS:3 Main catalogue"
obs_description = "The eROSITA space X-ray telescope, operated by the German eROSITA Consortium (eROSITA-DE), has released its second data set (DR2) from the SRG/eROSITA all-sky survey. The eRASS:3 main catalogue stacks the first three survey passes over the Western Galactic Hemisphere and contains 1,975,540 X-ray sources detected with eSASS in the 0.2-2.3 keV band (detection likelihood above 6), with ML fluxes, rates and counts in the main band and nine sub-bands, corrected positions with uncertainties, extent measurements, quality flags, and cross-identifications to eRASS1, the eRASS:3 hard catalogue, 5XMM, Chandra CSC 2.1 and ROSAT 2RXS. The default column set is the 40 identifier, position, extent, main-band and flag columns; all 250 columns are available with columns='all'."
bib_reference = "Ramos-Ceja, M. E., et al. 2026, A&A, accepted (eROSITA-DE DR2 catalogues)"
bib_reference_url = "https://erosita.mpe.mpg.de/dr2/AllSkySurveyData_dr2/Catalogues_dr2/"
obs_ack = "Please follow the eROSITA-DE DR2 acknowledgement guidelines at https://erosita.mpe.mpg.de/dr2/"
obs_copyright = "eROSITA-DE DR2 public data release (German eROSITA Consortium)"                  # terms of the original data
obs_copyright_url = "https://erosita.mpe.mpg.de/dr2/"
hats_copyright = ""                 # terms of this HATS product
prov_progenitor = "eRASS3_Main_v1.3.fits.gz from https://erosita.mpe.mpg.de/dr2/AllSkySurveyData_dr2/Catalogues_dr2/ (sha256 0eb3df0c688f8ac95e63df73a7d582fc7e325cb7a57b72e070afe139541c619c), re-encoded from the 2026-10-13 HATS build"
creator_did = "ivo://data.lsdb/uw/erass3_main"                    # IVOID as the registry assigns it, e.g. "ivo://<authority>/<site>/mysurvey_dr1"
publisher_id = ""
hats_creator = ""
t_min = 0.0                         # MJD; 0.0 = not written
t_max = 0.0
data_ucd = ""
extra = {}                          # any other key -> value

[writer]
use_dictionary = [   # choose_encoding.py 2026-10-24: best 0.607x, hats default 0.608x of 1 input file(s); BSS on 204/219 floats
    "APE_CTS_1", "APE_CTS_P1", "APE_CTS_P2", "APE_CTS_P3", "APE_CTS_P4", "APE_CTS_P5", "APE_CTS_P6", "APE_CTS_P7",
    "APE_CTS_P8", "APE_CTS_P9", "DETUID", "EXT", "EXT_ERR", "EXT_LIKE", "EXT_LOWERR", "EXT_UPERR", "FLAG_CSC",
    "FLAG_NO_CTS_ERR", "FLAG_NO_EXT_ERR", "FLAG_NO_RADEC_ERR", "FLAG_OPT", "FLAG_SP_BPS", "FLAG_SP_GC_CONS",
    "FLAG_SP_LGA", "FLAG_SP_SCL", "FLAG_SP_SNR", "IAUNAME", "ID_CLUSTER", "ID_SRC", "ML_EEF_1", "ML_EEF_P1",
    "ML_EEF_P2", "ML_EEF_P3", "ML_EEF_P4", "ML_EEF_P5", "ML_EEF_P6", "ML_EEF_P7", "ML_EEF_P8", "ML_EEF_P9",
    "SKYTILE", "UID", "UID_2RXS", "UID_5XMM", "UID_CSC", "UID_DR1", "UID_Hard"
]
                                    # ZSTD 15, page index, statistics, BYTE_STREAM_SPLIT floats, DELTA_BINARY_PACKED _healpix_29,
                                    # dictionary on the rest. Leave the overrides unset for a standard run.
# compression = "zstd"
# compression_level = 15
# use_dictionary = ["COL"]          # only these columns get a dictionary (an empty list is ignored, not "none")
# column_encoding = { COL = "PLAIN" }  # per-leaf encoding overrides, Parquet path ("A.list.element")
create_metadata = true              # dataset/_metadata (all row-group footers in one file); false when it would pass Parquet's 4 GiB footer limit (~10^5 row groups x a few hundred columns)
row_group_size = 100000             # choose_encoding.py 2026-10-24: rows per row group; replaces [partitioning].row_groups

[dask]                              # (interview) see reference/import.md "resources"
n_workers = 16
threads_per_worker = 1
memory_limit = "6GB"   # per worker ("16GB", "16G", "15GiB", "500MB", or "auto" = node memory, or HATS_PUBLISH_MAX_MEM_GB when set, / n_workers); >= 1.5x the largest FITS input (one worker holds a whole FITS file while mapping/splitting) and >= ~5x a partition on disk (margin stage); the import refuses to start otherwise
                                    # shared-node caps: n_workers x threads_per_worker <= pinned CPUs; HATS_PUBLISH_MAX_MEM_GB lowers n_workers first, then memory_limit
tmp_dir = ""                        # COLD: large shared disk for shards; "" -> <build_root>/tmp
dask_tmp = "/lscratch/ncaplar/erass3_reimport_dask"   # HOT: local disk for worker spill
resume_tmp = ""                     # keep empty: hats-import 0.11.0 margin markers break when this differs from tmp_dir
max_cpus = 0   # 0 = HATS_PUBLISH_MAX_CPUS or no pinning; otherwise pin to this many physical cores (one logical CPU each; shared nodes)

[ancillary]
thumbnail_rows_per_partition = 10   # random rows per partition; capped by thumbnail_max_rows and the threshold
thumbnail_max_rows = 10000
skymap_png = true
partition_info_png = true
readme = true
index_html = true

[verify]
value_level = true                  # run_verify.sh skips the source-vs-HATS notebook when false
all_pairs_max_rows = 20000000       # above this the margin test runs on a 1 M-row random sample

[hosting]                           # (interview) target keys are defined by the site file (CONFIG.md)
targets = ["web", "mirror"]   # the first target is the primary copy (hats_status main), the others are mirrors
web_link_name = ""                  # "" -> names.public_name
autoindex_description = ""          # "" -> properties.obs_title

[site]                              # (interview) data.lsdb.io page (see reference/publishing.md)
group = "eROSITA"
name = "eRASS3 Main"
display_name = "eROSITA-DE DR2 eRASS:3 Main"
id = "erass3_main"   # permanent; lowercase letters, digits, underscores
description = "The eROSITA space X-ray telescope, operated by the German eROSITA Consortium (eROSITA-DE), has released its second data set (DR2) from the SRG/eROSITA all-sky survey. The eRASS:3 main catalogue stacks the first three survey passes over the Western Galactic Hemisphere and contains 1,975,540 X-ray sources detected with eSASS in the 0.2-2.3 keV band (detection likelihood above 6), with ML fluxes, rates and counts in the main band and nine sub-bands, corrected positions with uncertainties, extent measurements, quality flags, and cross-identifications to eRASS1, the eRASS:3 hard catalogue, 5XMM, Chandra CSC 2.1 and ROSAT 2RXS. The default column set is the 40 identifier, position, extent, main-band and flag columns; all 250 columns are available with columns='all'."
badges = ["US-West", "HTTP"]                         # (interview) page badges, e.g. a hosting-region label and "HTTP"
other_urls = [
  { label = "Official release", url = "https://erosita.mpe.mpg.de/dr2" },
  { label = "Column descriptions", url = "https://erosita.mpe.mpg.de/dr2/AllSkySurveyData_dr2/Catalogues_dr2/RamosM_DR2/eRASS3_Main_v1.3.html" },
  { label = "DR2 catalogue listing (Ramos-Ceja et al. 2026, A&A accepted)", url = "https://erosita.mpe.mpg.de/dr2/AllSkySurveyData_dr2/Catalogues_dr2/" },
]
notes = []                          # [{ title = "", content = "", type = "info" | "warning" }]

[registry]
authority = "ivo://data.lsdb/uw"     # IVOID prefix the registry assigns (<authority>/<id>); registry_entry.py warns when the generator disagrees
mirrors = [{ status = "mirror", url = "http://slac.data.lsdb.io:10942/lsdb/erosita/erosita_dr2_erass3" }]                        # informational: other copies of this catalog, [{ status = "mirror", url = "" }]

[versions]                          # minimum library versions; templates refuse to run below these
hats = "0.11.1"
lsdb = "0.11.1"
hats_import = "0.11.1"
